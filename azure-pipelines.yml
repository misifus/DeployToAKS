
# Docker
# Build a Docker image and deploy to AKS

trigger:
  - main

resources:
  - repo: self

variables:
  imageRepo: sampleapp
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: ubuntu-latest

        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              containerRegistry: 'AcrServiceConnection'
              repository: '$(imageRepo)'
              command: buildAndPush
              Dockerfile: '$(Build.SourcesDirectory)/app/Dockerfile'
              tags: |
                $(tag)
                latest

          - task: PublishPipelineArtifact@1
            displayName: Publish Kubernetes manifests
            inputs:
              targetPath: '$(Build.SourcesDirectory)/kubernetes'
              artifact: 'manifests'
              publishLocation: 'pipeline'

  - stage: Deploy
    displayName: Deploy to Dev
    dependsOn: Build
    variables:
      acrsecret: k8sexamplesacrauth

    jobs:
      - job: Deploy
        displayName: Deploy to AKS
        pool:
          vmImage: ubuntu-latest

        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download Kubernetes manifests
            inputs:
              buildType: 'current'
              artifactName: 'manifests'
              targetPath: '$(Pipeline.Workspace)/manifests'

          - task: KubernetesManifest@1
            displayName: Create ACR image pull secret
            inputs:
              action: 'createSecret'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'AKSServiceConnection'
              namespace: 'default'
              secretType: 'dockerRegistry'
              secretName: '$(acrsecret)'
              dockerRegistryEndpoint: 'AcrServiceConnection'

          - task: KubernetesManifest@1
            displayName: Deploy to AKS
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'AKSServiceConnection'
              namespace: 'default'
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              containers: |
                k8sexamplesacr.azurecr.io/$(imageRepo):$(tag)
                $(imageRepo):$(tag)
              imagePullSecrets: |
                $(acrsecret)
