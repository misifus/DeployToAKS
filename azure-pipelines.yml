
# Docker
# Build a Docker image

trigger:
  - main

resources:
  - repo: self

variables:
  imageRepo: sampleapp
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: ubuntu-latest
        steps:

        - task: Docker@2
          displayName: Build and image
          inputs:
             containerRegistry: 'AcrServiceConnection'
             command: build 
             dockerfile: '$(Build.SourcesDirectory)/app/Dockerfile'
             tags:
               $(tag)
               latest 

